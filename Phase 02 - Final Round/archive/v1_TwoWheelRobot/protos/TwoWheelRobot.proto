          Shape {
            appearance PBRAppearance {
              baseColor IS bodyColor
              roughness 0.6
              metalness 0.1
            }
            geometry Box {
              size 0.088 0.055 0.003
            }
          }
        ]
      }

      # 4 Brass Standoffs connecting lower and upper decks
      Transform {
        translation 0.035 0.022 0.0375
        children [
