      # DRIVETRAIN: LEFT & RIGHT WHEELS WITH MOTORS
      # ========================================================================
      # Left Wheel
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor -0.02 0.032 0.02
        }
        device [
          RotationalMotor {
            name "left_wheel_motor"
            maxVelocity 10.0
          }
          PositionSensor {
            name "left_wheel_sensor"
          }
