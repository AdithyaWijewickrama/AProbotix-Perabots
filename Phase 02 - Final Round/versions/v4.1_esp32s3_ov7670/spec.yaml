    status: pass
  - name: 'Test plan Phases A-C: 32 new test arenas, best-path reference, gap analysis'
    result: '63 runs, 53 fully right; problems found: crooked start, tile counting, tight maze entrance'
    status: partial
    link: test/results/phaseC.md
  - name: Fix 1 - crooked start (re-run of every arena)
    result: 6 failing runs fixed
    status: pass
    link: test/results/fix1_compare.md
  - name: Fix 2 - tile counting (re-run)
    result: all 44 runs fully right
    status: pass
