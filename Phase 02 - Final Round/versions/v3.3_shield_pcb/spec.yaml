id: v3.3
name: GuardianBot v3 + Mega shield PCB
tag: v3.3-pcb
date: 2026-11-17
status: superseded by v4.0 - simulation + real firmware + CAD + PCB
summary: Same robot as v3.2, but all wiring is on a through-hole Mega shield with keyed JST-XH connectors (no loose jumpers). The ESP32-S3 plugs into the shield.
body:
  shape: round 150 mm, 3 acrylic decks, rear pocket, camera mast, Mega shield on the top deck
  size_mm: [150, 150, 152]
  height_mm: 152
  decks: 3 (3 mm acrylic) + 1.6 mm shield PCB
  gripper: rear pocket + 2 arms, one Kpower M0170 servo each
weight_g: 625
weight_note: v3.2 + shield PCB, connectors and headers (about 30 g)
controllers: [Arduino Mega 2560 (body), ESP32-S3 DevKitC-1 (brain, on the shield), ESP32-CAM (eye)]
drive: 2 x N20 12 V encoder motors, 43 mm wheels, L298N
battery: 3S LiPo 1000-1500 mAh
sensors:
  - ESP32-CAM OV2640 (48 x 32 grid, ~15 fps)
  - 4 x HC-SR04
  - 5 x Sharp GP2Y0A21
  - 2 x TCS3200
  - 5-ch TCRT5000 line array
  - MPU6050
pcb:
  type: Mega shield 107 x 83 mm, 2 layers, all through-hole, 25 JST-XH/terminal connectors
  rules: 0.4 mm tracks (0.3 mm on a few), 0.3 mm clearance, 1.0/0.6 mm vias, 1.0 mm pin holes
  files: versions/v3.3_shield_pcb/pcb_v3 (KiCad, Gerbers zip, toner-transfer PDFs, BOM, DRC report)
budget:
  currency: LKR
  total: 13750
  total_with_spare_lipo: 18180
  note: v3.2 essentials + local PCB (about Rs 3,000, get a quote) + 21 JST-XH sets + shield parts, minus the vero board and jumpers
simulation:
  judge: same electronics and code as v3.2 (the shield changes wiring only)
  section1_s: 19.5
  maze_s: 60.4
  end_s: 152.1
  collisions: 0
  firmware_sil_end_s: 187.8
  result: full mission, piece placed
files:
  - versions/v3.3_shield_pcb (firmware, shield PCB + generator, v3 guide, old acrylic/prints) and git tag v3.3-pcb
tests:
  - name: Simulation
    result: not re-run - same electronics and code as v3.2 (the shield changes wiring only)
    status: info
  - name: Shield PCB design-rule check (KiCad DRC)
    result: 0 unconnected pads; 6 errors (GND pads with 1 thermal spoke instead of 2), 139 warnings (silkscreen, library footprint)
