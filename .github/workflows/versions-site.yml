# Rebuilds the GuardianBot version-comparison website and publishes it on GitHub Pages
# whenever the versions folder, or a hardware file / doc that the 3-D viewer offers, changes.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: versions-site
on:
  push:
    paths:
      - "Phase 02 - Final Round/versions/**"
      - "Phase 02 - Final Round/hardware/**"
      - "Phase 02 - Final Round/docs/*.md"
      - ".github/workflows/versions-site.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python "Phase 02 - Final Round/versions/build_site.py"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "Phase 02 - Final Round/versions/_site"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
